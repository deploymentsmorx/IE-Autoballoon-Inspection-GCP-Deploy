# SmorX Inspection stack — uniquely named so it can share a host with other SmorX apps
# (e.g. smorx-multisheet-server already listening on 9686 / 8080).
#
# Required on the host (never committed):
#   .env.smorx-inspection.production   app settings (POSTGRES_*, DATABASE_URL, JWT_SECRET, CORS_ORIGINS, VITE_API_URL, …)
#                                      Run deploy/use-costsheet-database.sh to point the admin API
#                                      at the Cost Sheet Postgres container and its own schema.
#   .secrets/aws/credentials           AWS shared-credentials file, mounted read-only
#
# Usage:
#   bash deploy/use-costsheet-database.sh  # once, before first API rebuild
#   docker compose -f docker-compose.smorx-inspection.yml \
#     --env-file .env.smorx-inspection.production up -d --build

name: smorx-inspection

services:
  db:
    image: postgres:16-alpine
    container_name: smorx-inspection-db
    restart: unless-stopped
    # Reachable from the api container only (no host port)
    env_file:
      - .env.smorx-inspection.production
    volumes:
      - smorx-inspection-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: smorx-inspection-api:latest
    container_name: smorx-inspection-api
    restart: unless-stopped
    env_file:
      - .env.smorx-inspection.production
    environment:
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      COSTSHEET_ADMIN_PORTAL_ONLY: "true"
      # boto3 reads keys from the mounted file when AWS_ACCESS_KEY_ID is blank
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/aws/credentials
      AWS_PROFILE: ${SMORX_INSPECTION_AWS_PROFILE:-default}
    networks:
      - default
      - costsheet-db
    ports:
      - "${SMORX_INSPECTION_API_PORT:-19686}:9686"
    volumes:
      - smorx-inspection-data:/app/data
      - ./.secrets/aws/credentials:/run/secrets/aws/credentials:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9686/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://100.51.165.76:19686}
        VITE_ADMIN_PORTAL_ONLY: "true"
    image: smorx-inspection-web:latest
    container_name: smorx-inspection-web
    restart: unless-stopped
    ports:
      - "${SMORX_INSPECTION_WEB_PORT:-18080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  smorx-inspection-data:
    name: smorx-inspection-data
  smorx-inspection-pgdata:
    name: smorx-inspection-pgdata

networks:
  costsheet-db:
    external: true
    name: smorx-costsheet_default
